<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <title>مشغل اللعبة</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #game { width: 100%; height: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { color: #ddd; font: 14px system-ui, sans-serif; }
    #game { position: relative; }
    #status { position: absolute; inset: auto 12px 12px; z-index: 5; padding: 8px 12px; color: #ddd; background: #111d; border-radius: 4px; font-size: 12px; text-align: center; pointer-events: none; }
    #status:empty { display: none; }
    #game canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="status" role="status" aria-live="polite">جارٍ تجهيز المحاكي...</div>
  <script type="module" src="/js/emulator.js"></script>
</body>
</html>
